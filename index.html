<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d6d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日用品在庫">
  <title>日用品 在庫管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Daily Stock Manager</p>
      <h1>日用品 在庫管理</h1>
      <p class="lead">家にある日用品の在庫をスマホでさっと確認。買い忘れを防ぎましょう。</p>
    </div>
  </header>

  <main class="container">
    <section class="card form-card" aria-labelledby="register-title">
      <div class="section-title">
        <h2 id="register-title">商品を登録・編集</h2>
        <p>在庫が0になると「買い足し必要」と表示されます。</p>
      </div>

      <div class="voice-panel" aria-labelledby="voice-title">
        <button type="button" id="voice-button" class="voice-button" aria-describedby="voice-status" aria-pressed="false">
          <span class="voice-icon" aria-hidden="true">🎙️</span>
          <span>音声で入力</span>
        </button>
        <div>
          <h3 id="voice-title">マイク入力</h3>
          <p class="voice-example">例：「トイレットペーパー 3ロール」「洗剤 2本」「ティッシュ 1箱」</p>
          <p id="voice-status" class="voice-status" aria-live="polite">マイクボタンを押すと音声入力を開始します。</p>
        </div>
      </div>

      <form id="item-form" class="item-form">
        <input type="hidden" id="edit-id">

        <label>
          商品名
          <input type="text" id="item-name" placeholder="例：食器用洗剤" autocomplete="off" required>
        </label>

        <label>
          カテゴリ
          <select id="item-category" required>
            <option value="洗剤">洗剤</option>
            <option value="掃除用品">掃除用品</option>
            <option value="紙類">紙類</option>
            <option value="キッチン用品">キッチン用品</option>
            <option value="衛生用品">衛生用品</option>
            <option value="食品ストック">食品ストック</option>
            <option value="その他">その他</option>
          </select>
        </label>

        <div class="form-grid two-columns">
          <label>
            現在の在庫数
            <select id="item-stock" required>
              <option value="0">0</option>
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
          </label>

          <label>
            単位
            <select id="item-unit" required>
              <option value="個">個</option>
              <option value="本">本</option>
              <option value="箱">箱</option>
              <option value="袋">袋</option>
              <option value="枚">枚</option>
              <option value="ロール">ロール</option>
              <option value="パック">パック</option>
              <option value="セット">セット</option>
              <option value="ml">ml</option>
              <option value="L">L</option>
              <option value="g">g</option>
              <option value="kg">kg</option>
            </select>
          </label>
        </div>

        <label>
          メモ
          <textarea id="item-note" rows="3" placeholder="例：詰め替え用を買う"></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" class="primary-button" id="submit-button">追加する</button>
          <button type="button" class="secondary-button" id="cancel-edit-button" hidden>編集をキャンセル</button>
        </div>
      </form>
    </section>

    <section class="summary" aria-label="在庫の概要">
      <article class="summary-card">
        <span id="total-count">0</span>
        <p>登録商品</p>
      </article>
      <article class="summary-card needs">
        <span id="need-count">0</span>
        <p>買い足し必要</p>
      </article>
    </section>

    <section class="list-section" aria-labelledby="list-title">
      <div class="section-title list-title-row">
        <div>
          <h2 id="list-title">在庫リスト</h2>
          <p>在庫数は ＋1 / −1 で素早く更新できます。内容変更は「編集」からできます。</p>
        </div>
      </div>
      <div id="item-list" class="item-list"></div>
      <p id="empty-message" class="empty-message">商品がまだ登録されていません。</p>
    </section>
  </main>

  <script src="script.js?v=2"></script>
</body>
</html>
